# Atma Theory Pronunciation Dictionary
#
# Used by the TTS preparation layer to guide US English narrators through
# Sanskrit, Indian, and other non-English terms without altering the
# canonical script.
#
# Format:
#   CanonicalSpelling:
#     pronunciation: "RESPELLING"   # CAPS = stressed syllable, hyphens = syllable breaks
#     language: "Sanskrit"          # source language
#
# Pronunciation style: English-speaker-friendly respelling (not IPA).
# Example: "pah-TAN-jah-lee" — capital syllable carries primary stress.
#
# To add a term: append an entry below. The canonical spelling must match
# exactly what appears in the script (case-sensitive).

