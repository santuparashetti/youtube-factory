<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 260px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .top { background: #10a37f; color: #fff; padding: 14px 16px; }
    .top h1 { font-size: 14px; margin: 0; font-weight: 600; }
    .body { padding: 14px 16px; font-size: 13px; color: #333; line-height: 1.55; }
    .body p { margin: 0 0 10px; }
    .body ol { margin: 0 0 10px; padding-left: 18px; }
    .body li { margin-bottom: 4px; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 12px; }
    .note { font-size: 12px; color: #888; margin-top: 8px; }
    a { color: #10a37f; }
  </style>
</head>
<body>
  <div class="top"><h1>Batch Image Generator</h1></div>
  <div class="body">
    <p>The control panel lives on the ChatGPT page itself.</p>
    <ol>
      <li>Open <a href="https://chatgpt.com" target="_blank">chatgpt.com</a> and start a new chat.</li>
      <li>Look for the green <strong>Batch Image Generator</strong> panel (top-right).</li>
      <li>Pick your prompts file, then click <strong>Start</strong>.</li>
    </ol>
    <p class="note">If you don't see the panel, refresh the ChatGPT tab.</p>
  </div>
</body>
</html>
